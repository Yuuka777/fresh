# p6spy 只用于性能采集，默认不生效：
# 只有当 spring.datasource.druid.driver-class-name 被换成
# com.p6spy.engine.spy.P6SpyDriver 时才会走到这里。
modulelist=com.p6spy.engine.spy.P6SpyFactory,com.p6spy.engine.logging.P6LogFactory

# 输出：时间 | 单条耗时(ms) | 类别 | SQL
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(currentTime)|%(executionTime)|%(category)|%(sql)

appender=com.p6spy.engine.spy.appender.FileLogger
logfile=D:/project/.workbuddy/tmp/p6spy/p6spy.log
# 每次启动重新开始，便于按轮次对比
append=false

# 只留 statement（真正执行的 SQL），去掉结果集等噪音
excludecategories=info,debug,result,resultset

deregisterdrivers=true
