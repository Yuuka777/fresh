server:
  port: 8080

spring:
  profiles:
    active: dev

  # 连接信息本体在 application-dev.yml 的 xianhe.datasource.*，
  # 这里只负责拼装 JDBC URL 并交给 Druid。两处键名不同，不构成自引用。
  datasource:
    druid:
      driver-class-name: ${xianhe.datasource.driver-class-name}
      url: jdbc:mysql://${xianhe.datasource.host}:${xianhe.datasource.port}/${xianhe.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${xianhe.datasource.username}
      password: ${xianhe.datasource.password}

  redis:
    host: ${xianhe.redis.host}
    port: ${xianhe.redis.port}
    password: ${xianhe.redis.password}
    database: ${xianhe.redis.database}

  mvc:
    pathmatch:
      # springfox(knife4j) 3.0 在 Spring Boot 2.6+ 上必须用 ant 匹配策略，
      # 否则启动时报 documentationPluginsBootstrapper 初始化失败
      matching-strategy: ant_path_matcher

  servlet:
    multipart:
      # Spring Boot 默认为 1MB，契约 2.3.1 允许单张图片 2MB，这里放宽到契约上限。
      # 超过上限会在进入 Controller 之前抛 MaxUploadSizeExceededException，
      # 由 GlobalExceptionHandler 转成「文件上传失败」。
      max-file-size: 2MB
      max-request-size: 10MB

mybatis:
  # Mapper XML 位置
  mapper-locations: classpath:mapper/*.xml
  # 起别名，XML 里可用短名引用实体与 DTO/VO
  type-aliases-package: com.xianhe.entity,com.xianhe.dto,com.xianhe.vo
  configuration:
    # 开启驼峰命名：goods_category.storage_zone -> storageZone
    map-underscore-to-camel-case: true

logging:
  level:
    com.xianhe.mapper: debug
    com.xianhe.service: info
    com.xianhe.controller: info

# ------------------------------------------------------------------
# 本文件只放「与环境无关」的配置。
# 数据源、Redis、密钥、对象存储、微信凭证等与环境相关的值全部放在
# application-dev.yml 中，该文件不入版本库；模板见 application-dev.yml.example。
# ------------------------------------------------------------------
xianhe:
  jwt:
    # 管理端令牌：请求头 token（《接口文档》1.3）
    admin-ttl: 7200000
    admin-token-name: token
    # 用户端令牌：请求头 authentication
    user-ttl: 7200000
    user-token-name: authentication

  wechat:
    jscode2session-url: https://api.weixin.qq.com/sns/jscode2session
