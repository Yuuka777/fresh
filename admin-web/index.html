<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>鲜禾前置仓 · 运营台</title>
    <link rel="preconnect" href="https://fonts.loli.net" />
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin />
    <!-- 字体样式表异步加载：同步加载会阻塞渲染与 DOMContentLoaded
         （实测第三方 CDN 慢时会拖住整个首屏），交给 font-display: swap 渐进替换 -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
  </head>
  <body>
    <div id="app">
      <div class="boot-splash">正在装载运营台…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
